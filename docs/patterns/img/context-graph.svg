  <path class="e" d="M274 333 C337 333 337 220 400 220"/>
  <path class="e" d="M274 333 C337 333 337 310 400 310"/>
  <path class="e-off" d="M274 405 C337 405 337 220 400 220"/>
  <path class="e-off" d="M274 405 C337 405 337 310 400 310"/>
  <path class="e" d="M274 477 C337 477 337 220 400 220"/>
  <path class="e" d="M274 477 C337 477 337 310 400 310"/>
  <path class="e" d="M274 477 C337 477 337 400 400 400"/>
  <path class="e-hl" d="M274 261 C337 261 337 130 400 130"/>
  <path class="e-hl" d="M274 333 C337 333 337 130 400 130"/>
  <path class="e-hl" d="M274 477 C337 477 337 130 400 130"/>

  <!-- рёбра модуль → домен -->
  <path class="e" d="M550 220 C625 220 625 236 700 236"/>
  <path class="e" d="M550 220 C625 220 625 278 700 278"/>
  <path class="e" d="M550 220 C625 220 625 320 700 320"/>
  <path class="e" d="M550 220 C625 220 625 362 700 362"/>
  <path class="e" d="M550 220 C625 220 625 404 700 404"/>
  <path class="e" d="M550 220 C625 220 625 446 700 446"/>
