  <rect class="node" x="400" y="470" width="150" height="40" rx="8"/>
  <text class="t-mod" x="475" y="495">check</text>

  <!-- домены -->
  <rect class="node-hl" x="700" y="96" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="115">sdd-conformance</text>
  <rect class="node-hl" x="700" y="138" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="157">workflow-board</text>
  <rect class="node-hl" x="700" y="180" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="199">spec-delta-viewer</text>
  <rect class="node-hl" x="700" y="222" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="241">task-metrics</text>
  <rect class="node-hl" x="700" y="264" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="283">workflow-designer</text>
  <rect class="node-hl" x="700" y="306" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="325">workspace-explorer</text>
  <rect class="node" x="700" y="348" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="367">ide-runtime</text>
  <rect class="node" x="700" y="390" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="409">archive-preview</text>
  <rect class="node" x="700" y="432" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="451">artifact-editor</text>
  <rect class="node" x="700" y="474" width="256" height="28" rx="6"/>
  <text class="t" x="712" y="493">vscode-extension</text>
  <rect class="node-off" x="700" y="516" width="256" height="28" rx="6"/>
  <text class="t-off" x="712" y="535">agent-bridge — ничей, удаляется</text>

  <!-- легенда -->
  <line x1="24" y1="580" x2="56" y2="580" class="e-hl"/>
  <text class="legend" x="64" y="584">срез core: ≈ 17,6 тыс. токенов, 12 файлов</text>
  <line x1="340" y1="580" x2="372" y2="580" class="e"/>
  <text class="legend" x="380" y="584">прочие связи</text>
  <path class="dep" d="M486 580 h30" marker-end="url(#arrow)"/>
  <text class="legend" x="524" y="584">depends_on</text>
  <line x1="620" y1="580" x2="652" y2="580" class="e-off"/>
  <text class="legend" x="660" y="584">недействующий ADR, домен без модулей</text>
</svg>
