  <path class="e" d="M550 310 C625 310 625 194 700 194"/>
  <path class="e" d="M550 310 C625 310 625 236 700 236"/>
  <path class="e" d="M550 310 C625 310 625 278 700 278"/>
  <path class="e" d="M550 310 C625 310 625 404 700 404"/>
  <path class="e" d="M550 400 C625 400 625 320 700 320"/>
  <path class="e" d="M550 400 C625 400 625 446 700 446"/>
  <path class="e" d="M550 400 C625 400 625 488 700 488"/>
  <path class="e-hl" d="M550 130 C625 130 625 110 700 110"/>
  <path class="e-hl" d="M550 130 C625 130 625 152 700 152"/>
  <path class="e-hl" d="M550 130 C625 130 625 194 700 194"/>
  <path class="e-hl" d="M550 130 C625 130 625 236 700 236"/>
  <path class="e-hl" d="M550 130 C625 130 625 278 700 278"/>
  <path class="e-hl" d="M550 130 C625 130 625 320 700 320"/>

  <!-- depends_on: дуги слева от модулей -->
  <path class="dep" d="M400 214 C384 214 384 136 398 136" marker-end="url(#arrow)"/>
  <path class="dep" d="M400 304 C370 304 370 128 398 128" marker-end="url(#arrow)"/>
  <path class="dep" d="M400 394 C384 394 384 226 398 226" marker-end="url(#arrow)"/>
  <path class="dep" d="M400 484 C362 484 362 216 398 216" marker-end="url(#arrow)"/>

  <!-- ADR -->
  <rect class="node" x="24" y="100" width="250" height="34" rx="6"/>
  <text class="t" x="36" y="122">ADR-001 · расширение VS Code</text>
  <rect class="node" x="24" y="172" width="250" height="34" rx="6"/>
  <text class="t" x="36" y="194">ADR-002 · бэкенд через inject()</text>
  <rect class="node-hl" x="24" y="244" width="250" height="34" rx="6"/>
  <text class="t" x="36" y="266">ADR-003 · истина — файлы и CLI</text>
  <rect class="node-hl" x="24" y="316" width="250" height="34" rx="6"/>
  <text class="t" x="36" y="338">ADR-004 · чистый core</text>
  <rect class="node-off" x="24" y="388" width="250" height="34" rx="6"/>
  <text class="t-off" x="36" y="410">ADR-005 · агент в IDE (отменён)</text>
  <rect class="node-hl" x="24" y="460" width="250" height="34" rx="6"/>
  <text class="t" x="36" y="482">ADR-006 · контекст, а не агенты</text>

  <!-- модули -->
  <rect class="node-core" x="400" y="110" width="150" height="40" rx="8"/>
  <text class="t-core" x="475" y="135">core</text>
