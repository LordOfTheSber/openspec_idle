<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610" role="img" aria-labelledby="t d">
  <title id="t">Граф контекста этого репозитория</title>
  <desc id="d">Слева ADR, в середине модули core, server, web, vscode, check с дугами depends_on, справа домены. Подсвечен срез модуля core: шесть его доменов и ADR-003, ADR-004, ADR-006.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #0b0b0b; }
    .title { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12px; fill: #52514e; }
    .head { font-size: 11px; fill: #52514e; text-transform: uppercase; letter-spacing: 0.05em; }
    .node { fill: #ffffff; stroke: #c8c7c1; }
    .node-hl { fill: #e3eefb; stroke: #2a78d6; }
    .node-core { fill: #2a78d6; stroke: #2a78d6; }
    .node-off { fill: #ffffff; stroke: #b9b8b2; stroke-dasharray: 4 3; }
    .t { font-size: 12px; }
    .t-mod { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .t-core { font-size: 13px; font-weight: 600; text-anchor: middle; fill: #ffffff; }
    .t-off { font-size: 12px; fill: #8a8984; }
    .e { fill: none; stroke: #d6d5cf; stroke-width: 1; }
    .e-hl { fill: none; stroke: #2a78d6; stroke-width: 1.8; }
    .e-off { fill: none; stroke: #c8c7c1; stroke-width: 1; stroke-dasharray: 4 3; }
    .dep { fill: none; stroke: #52514e; stroke-width: 1.3; }
    .legend { font-size: 12px; fill: #52514e; }
  </style>
  <rect x="0.5" y="0.5" width="979" height="609" rx="10" fill="#fcfcfb" stroke="#e4e3df"/>
  <text class="title" x="24" y="32">Граф контекста этого репозитория</text>
  <text class="sub" x="24" y="52">ADR → модули → домены; дуги слева от модулей — depends_on. Синим — срез модуля core.</text>

  <text class="head" x="24" y="86">ADR</text>
  <text class="head" x="400" y="86">модули</text>
  <text class="head" x="700" y="86">домены (спеки)</text>

  <!-- рёбра ADR → модуль -->
  <path class="e" d="M274 117 C337 117 337 400 400 400"/>
  <path class="e" d="M274 117 C337 117 337 310 400 310"/>
  <path class="e" d="M274 117 C337 117 337 220 400 220"/>
  <path class="e" d="M274 189 C337 189 337 220 400 220"/>
  <path class="e" d="M274 189 C337 189 337 400 400 400"/>
  <path class="e" d="M274 189 C337 189 337 490 400 490"/>
