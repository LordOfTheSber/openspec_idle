<text class="val" x="187" y="74">срез без дисциплины</text>
<line x1="344" y1="70" x2="362" y2="70" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<text class="val" x="368" y="74">срез с дисциплиной</text>
