<text class="lbl" x="650" y="96.2">весь контекст</text>
<text class="val" x="650" y="111.2">≈ 483 тыс.</text>
<text class="lbl" x="650" y="266.0">срез без дисциплины</text>
<text class="val" x="650" y="281.0">≈ 117 тыс.</text>
<text class="lbl" x="650" y="317.5">срез с дисциплиной</text>
<text class="val" x="650" y="332.5">≈ 30 тыс.</text>
<text class="sub" x="24" y="390">Допущения: общий контекст 3 тыс., context.md 1,5 тыс., 4 домена на модуль, спека 2,5 тыс., ADR 0,6 тыс. на модуль,</text>
<text class="sub" x="24" y="406">домен у 1,3 модуля, 30 % доменов в замыкании общие; changes архивируются вовремя.</text>
<text class="sub" x="24" y="422">Срез с дисциплиной — замыкание depends_on из 3 модулей; без дисциплины — замыкание на ¼ проекта.</text>
