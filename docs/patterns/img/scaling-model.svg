<svg xmlns="http://www.w3.org/2000/svg" width="800" height="436" viewBox="0 0 800 436" role="img" aria-labelledby="t d">
<title id="t">Модель: весь контекст и срез при росте проекта</title>
<desc id="d">Весь контекст растёт линейно: 99 тыс. при 10 модулях, 483 тыс. при 50. Срез с дисциплиной связей остаётся около 30 тыс. Срез при depends_on на четверть проекта растёт до 117 тыс. при 50 модулях.</desc>
<style>text{font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;fill:#0b0b0b}.title{font-size:16px;font-weight:600}.sub{font-size:12px;fill:#52514e}.tick{font-size:11px;fill:#52514e}.lbl{font-size:12px;font-weight:600}.val{font-size:12px;fill:#52514e}.grid{stroke:#ecebe7}</style>
<rect x="0.5" y="0.5" width="799" height="435" rx="10" fill="#fcfcfb" stroke="#e4e3df"/>
<text class="title" x="24" y="32">Модель роста: весь контекст и срез модуля</text>
<text class="sub" x="24" y="52">≈ тыс. токенов; модель, не замер — допущения внизу</text>
<line x1="24" y1="70" x2="42" y2="70" stroke="#9b9a94" stroke-width="2.5" stroke-linecap="round"/>
<text class="val" x="48" y="74">весь контекст</text>
