schema: spec-driven

context: |
  Проект: OpenSpec IDE — расширение VS Code для работы по методологии OpenSpec.
  Пользователь открывает в VS Code папку проекта; расширение поднимает бэкенд
  IDE внутри своего процесса (без сетевого порта), показывает нативное дерево и
  диагностику, а доску, дельты, метрики, агент и конструктор процессов — в
  панели webview. Источник истины — файлы `openspec/` на диске и CLI
  `@fission-ai/openspec`; IDE их читает, показывает и редактирует, но не
  дублирует их состояние в своей БД.

  Tech stack:
  - Монорепозиторий npm workspaces, TypeScript (strict), Node.js >= 22, ESM.
  - Расширение: VS Code API 1.90+, сборка esbuild в CommonJS, упаковка vsce.
  - Бэкенд: Node + Fastify (в расширении — через inject(), в разработке — HTTP
    и SSE), spawn CLI-процессов.
  - Интерфейс разделов: React 19 + Vite, общается с бэкендом сообщениями
    webview (в разработке — fetch).
  - Тесты: Vitest (unit/integration, дымовой тест бандла расширения с
    подменённым модулем vscode), Playwright (e2e интерфейса поверх фикстурного
    проекта).
  - Локализация UI: русский по умолчанию, ключи вынесены в словарь.

  Интеграция с LLM:
  - Единственный поддерживаемый агент MVP — GigaCode CLI (форк Qwen Code,
    который форк Gemini CLI). Взаимодействие headless: одноразовый запуск
    процесса с позиционным промптом и `--output-format stream-json`.
  - Ключи и токены никогда не попадают в код и в репозиторий: только env
    и локальный файл конфигурации вне git.

  Домен и терминология (совпадает с OpenSpec):
  - change — предложение изменения, каталог в `openspec/changes/<name>/`.
  - artifact — proposal.md, specs/**/*.md, design.md, tasks.md.
  - spec / capability — файл `openspec/specs/<capability-path>/spec.md`.
  - delta — секции ADDED/MODIFIED/REMOVED/RENAMED Requirements в спеке change.
  - requirement / scenario — `### Requirement:` и `#### Scenario:`.

  Конвенции:
  - Conventional commits.
  - Пользовательские строки — на русском, идентификаторы, пути и код — на английском.
  - Любое обращение к openspec CLI идёт через один модуль-обёртку с JSON-выводом,
    прямые вызовы `execSync` из UI-слоя запрещены.

rules:
  proposal:
    - Пиши на русском языке
    - Секция Capabilities обязана перечислять точные kebab-case пути спеков
  specs:
    - Пиши на русском языке, нормативные формулировки через ДОЛЖЕН/ДОЛЖНА (SHALL)
    - Каждое требование имеет минимум один сценарий с WHEN/THEN
  design:
    - Пиши на русском языке
    - Каждое решение сопровождается рассмотренной альтернативой
  tasks:
    - Пиши на русском языке
    - Каждая задача содержит метрику приёмки — как проверить, что она сделана

operations:
  apply:
    guidance:
      - После каждой группы задач прогоняй `npm run verify` и фиксируй результат
  archive:
    guidance:
      - Перед архивацией убедись, что `openspec validate --strict` проходит
