# Настройки OpenSpec для проекта (CLI @fission-ai/openspec 1.13.x).
#
#   context     вставляется в инструкции КАЖДОГО артефакта и операций apply и
#               archive. Здесь только то, что нужно в любой задаче, и маршрут к
#               подробностям в openspec/context/ — не копия их.
#   rules       дополняют инструкции своего артефакта в схеме spec-driven; то,
#               что схема уже требует, здесь не повторяется. Правила совпадают
#               с проверками `npm run check:openspec` (в скобках — имя правила):
#               агент сразу пишет так, чтобы CI не дал замечаний.
#   operations  подсказки для apply и archive.
#
# Формулировки «каждое решение сопровождается рассмотренной альтернативой» и
# «каждая задача содержит метрику приёмки» цитируются в сообщениях
# openspec/quality.yaml — меняйте их вместе.
# IDE читает отсюда только строку `schema:` (раздел «Процессы» её правит).
schema: spec-driven

context: |
  OpenSpec IDE — расширение VS Code для работы по методологии OpenSpec: дерево
  changes и спеков, замечания в панели «Проблемы», помощь в редакторе; в панели
  webview — разделы «Обозреватель», «Доска», «Дельты», «Метрики», «Качество»,
  «Контекст», «Структура», «Процессы». Команда `openspec-ide-check` выполняет
  те же проверки в CI.

  Принципы (change, который их меняет, вводит или отменяет ADR):
  - Источник истины — файлы `openspec/` и CLI OpenSpec. Своего состояния
    проекта у IDE нет; исключение — журнал метрик в каталоге `.openspec-ide`
    (вне git).
  - IDE не вызывает LLM и не запускает агентов: она готовит и проверяет для них
    контекст в `openspec/context/`.
  - Расширение, панель и CI работают через одни маршруты `/api/*` бэкенда,
    поэтому правила у них совпадают.

  Устройство — npm workspaces, TypeScript strict, Node.js 22+, ESM:
  - `packages/core` — чистая модель и правила: без `node:*` и внешних пакетов;
  - `packages/server` — Fastify: файлы, CLI OpenSpec, git, маршруты `/api/*`;
    в расширении вызывается через `inject()`, без порта;
  - `packages/web` — разделы панели на React 19 + Vite;
  - `packages/vscode` — расширение VS Code 1.90+: дерево, диагностика, команды;
  - `packages/check` — консольная команда `openspec-ide-check`.
  Зависимости: core → server → vscode и check; core → web → vscode.

  Перед артефактом прочитай, а не вспоминай:
  - `openspec/context/*.md` — общий контекст и договорённости;
  - модули в `openspec/context/modules/`, чьи `code_paths` задевает change, —
    их части, `depends_on` и ADR из `openspec/context/adr/`;
  - спеки — `openspec list --specs`; незаархивированные changes тоже меняют
    требования — пересечения покажет `npm run check:openspec -- --only drift`.

  Термины проекта (термины OpenSpec — как в OpenSpec):
  - модуль контекста — папка в `openspec/context/` с метаданными `module`,
    `domains`, `code_paths`, `depends_on`; домен — спека из `openspec/specs/`;
    связь модуль ↔ домен — многие-ко-многим;
  - набор контекста модуля — общий контекст, части модуля и его зависимостей,
    спеки доменов, действующие ADR;
  - строка `↳ <capability> / <сценарий>` под пунктом плана связывает задачу со
    сценарием дельты;
  - `API_REVISION` в `packages/core/src/constants.ts` — ревизия протокола
    панель ↔ бэкенд.

  Язык: спеки, документация, комментарии, сообщения коммитов и строки
  интерфейса — на русском; идентификаторы, пути и код — на английском. Строки
  интерфейса записаны прямо в коде, без словаря.

  Проверка: `npm run verify` — typecheck, eslint, Vitest; `npm run test:e2e` —
  сборка и Playwright поверх `tests/fixtures/`; `npm run check:openspec` —
  проверки проекта, как в CI.

rules:
  proposal:
    - Пиши на русском языке
    - В Capabilities каждая строка — путь спеки в `коде` и что меняется, например «`task-metrics` — приём отчётов о запусках»; новую capability заводи, только если не подходит ни одна из `openspec list --specs` и незаархивированных changes
    - В Impact перечисли затронутые пакеты `packages/*` и назови, нужны ли подъём `API_REVISION`, новый ADR и правка контекста в `openspec/context/`
  specs:
    - Пиши на русском языке, нормативные формулировки через ДОЛЖЕН/ДОЛЖНА (SHALL), запрет — НЕ ДОЛЖЕН (SHALL NOT)
    - Одно требование — одно поведение — все его нормативные предложения говорят об одном (atomicity); второе поведение — отдельное требование
    - Каждое условие «если / когда / при …» из текста требования покрыто сценарием, в WHEN или имени которого есть его слова (branch-coverage); каждое значение перечисления в `коде` встречается хотя бы в одном сценарии (enumeration-coverage); у порога «не более N» есть сценарии на N и выше N (boundary-values)
    - THEN проверяет то, что видно снаружи — в интерфейсе, ответе `/api/*`, панели «Проблемы» или выводе `openspec-ide-check`, а не вызовы функций и внутреннее состояние (observable-then, implementation-leak)
    - Надписи интерфейса и тексты замечаний в THEN — в «ёлочках» и дословно, как в коде (code-message)
    - Без слов, по которым нельзя написать проверку («корректный», «валидный», «и т. д.», «например», «при необходимости») — вместо них условие или перечисление (vague-wording)
    - Перед MODIFIED проверь `npm run check:openspec -- --only drift` — если то же требование меняет другой незаархивированный change, учти его правки
  design:
    - Пиши на русском языке
    - Каждое решение сопровождается рассмотренной альтернативой — абзац «Альтернатива — …» с причиной отказа под каждым заголовком `###` (artifact-rule design-alternative)
    - Раскладывай по пакетам по правилу проекта — логика и правила в `packages/core`, ввод-вывод в `packages/server`, провайдеры VS Code — тонкие обёртки над моделью; отступление от него обоснуй
    - Если решение меняет принцип из контекста проекта или устройство пакетов, назови ADR, который нужно завести или отменить
  tasks:
    - Пиши на русском языке
    - Каждая задача содержит метрику приёмки — как проверить, что она сделана: в конце пункта «проверка — <тест с путём от корня, команда или e2e-сценарий>» (artifact-rule task-acceptance, plan-test-ref)
    - Под задачей — строки `↳ <capability> / <сценарий>` для сценариев дельт, которые она реализует; каждый сценарий дельт покрыт хотя бы одной задачей (coverage)
    - Задача, добавляющая поле или маршрут для интерфейса, включает подъём `API_REVISION`; задача, меняющая точки входа, контракты или инварианты модуля, — правку его контекста в `openspec/context/` по навыку `context-fill`
    - Последняя группа — документация (README, `openspec/context/`) с приёмкой «`npm run verify` и `npm run test:e2e` проходят, `openspec validate <change> --strict` проходит»

operations:
  apply:
    guidance:
      - Перед первой задачей прочитай набор контекста модулей, чьи `code_paths` задевает change
      - Отмечай задачу выполненной только после того, как прошла проверка из её текста; после каждой группы задач прогоняй `npm run verify` и фиксируй результат
      - Когда выполнены все задачи, прогони `npm run check:openspec` и предложи архивировать change — до архивации его требований нет в основных спеках и наборах контекста модулей
  archive:
    guidance:
      - Перед архивацией убедись, что `openspec validate <change> --strict` проходит и `npm run check:openspec -- --only drift,coverage` не даёт замечаний по этому change
      - После архивации добавь новые capabilities в `domains` модулей, которые их реализуют, убери удалённые и прогони `npm run check:openspec -- --only context`
      - Если change отменяет решение, поставь у ADR `status: superseded` и `superseded_by`
